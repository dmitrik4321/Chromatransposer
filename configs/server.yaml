# Chromatransposer server — конфиг как код (версионируется в репо)

mqtt:
  host: 127.0.0.1        # только ЛОКАЛЬНЫЙ брокер, облако не используется (решение D)
  port: 1883
  broker:                # прослойка сама поднимает MQTT (встроенный AMQTT-брокер)
    enabled: true        # false -> использовать внешний Mosquitto ниже
    bind: 0.0.0.0:1883   # LAN: ESP-устройства подключаются к этому брокеру

homeassistant:           # прослойка сама поднимает HA (требование)
  mode: embedded         # embedded | external | off
  container: chromatransposer-ha
  image: homeassistant/home-assistant:latest
  port: 8123
  startup_timeout_s: 90
  discovery:             # штатный HA MQTT-discovery; исходники HA не трогаем
    enabled: true
    prefix: homeassistant

state_dir: state

sync:
  tick_hz: 5             # общий тик стендов (решение B), дрейф <50 мс допустим

adapters:
  - type: wled
    hosts:               # дополняется mDNS-дискавери (_wled._tcp)
      - 192.168.1.40
  - type: gyverhub        # конструктор UI: топики виджетов задаются в скетче,
    devices:              # поэтому каждый узел описывается topic_map-ом
      matrix-wall:
        name: Матрица 16x16 (скетч GyverMatrix)
        topology: {kind: matrix, width: 16, height: 16, length: 256}
        effects: [rain, plasma, fire, snake]
        topic_map:
          on:        gyvermatrix/room1/power
          brightness: gyvermatrix/room1/bright
          effect:    gyvermatrix/room1/mode
          speed:     gyvermatrix/room1/speed
        avail_topic: gyvermatrix/room1/available
        http: http://192.168.1.41
      garland-v3:
        name: Гирлянда v3 (GyverHub-скетч)
        topology: {kind: strip, length: 90}
        effects: [noise, fade, blink]
        topic_map:
          on: garland/livingroom/power
          brightness: garland/livingroom/bright
          effect: garland/livingroom/prog

  - type: gyverlamp2      # стоковая GyverLamp2: UDP «GL», см. smeleshkin/GyverLamp2HA;
    group: 1              # порт вычисляется из группы+ключа (GL/1 => 61197),
    key: GL               # MQTT у лампы нет — не путать с gyverhub-конструктором
    lamps:
      lamp-desk:
        ip: 192.168.1.51
        name: Кольцо на столе
        ledcount: 60
  - type: opera           # Opera GX как устройство умного дома: публичного API
    hosts:                # нет, управляем через официальный CDP (--remote-debugging-port).
      - http://127.0.0.1:9222   # запуск: opera.exe --remote-debugging-port=9222
    device_id: opera-gx
    name: Opera GX
    # config: {poll_interval_s: 2.0}   # остальное — OPERA_CONFIG в начале файла
  - type: opera_mqtt      # второй коннектор к той же Opera GX: ОФИЦИАЛЬНОЕ расширение
    # config:             # github.com/operasoftware/opera-smart-home (Apache-2.0).
    #   panic:            # Расширение само публикует состояние в локальный брокер —
    #     hide_from_ha: true   # Panic Button не объявляем в HA UI (хотелка),
    #     auto_off: true       # а если его включили руками — гасим OFF командой.
    #   hide_entities_extra: [] # доп. антиприкол: скрыть ещё сущности от HA
    device_id: opera-gx-mqtt
    name: Opera GX (smart-home ext)
    # узлы рождаются лениво из трафика opera/<prefix>/... — hosts не нужны;
    # всё остальное — OPERA_MQTT_CONFIG в начале ct/adapters/opera_mqtt.py
  - type: native_ct
    devices:
      strip-corridor:
        topology: {kind: strip, length: 120, color_order: GRB}
        telemetry: [audio_level, audio_band]
      matrix-mini:
        name: Мини-матрица 8x8
        topology: {kind: matrix, width: 8, height: 8}
  # generic-«лапша» вынесена в configs/generic/*.yaml

groups:
  - id: wall
    name: Стена из двух матриц
    pattern: ["matrix-*"]
    sync: true
    canvas_length: 512
    segments:
      matrix-wall: {device_id: matrix-wall, start: 0, length: 256, canvas_offset: 0}
      matrix-mini: {device_id: matrix-mini, start: 0, length: 64, canvas_offset: 256}

scenes:
  - id: evening
    name: Вечерний режим
    steps:
      - group: wall
        ir: {"class": perlin, "params": {"speed": 0.2, "brightness": 0.4},
             "palette": {"stops": [{"pos": 0, "color": "#ff8800"},
                                    {"pos": 1, "color": "#330066"}]}}
      - device: strip-corridor
        state: {on: true, bri: 60}

schedules:
  - id: eve-1930
    scene_id: evening
    cronish: "daily 19:30"
    enabled: true
